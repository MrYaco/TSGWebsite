<!DOCTYPE html>
<!--
  CLASS INFORMATION PAGE

-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guild classes | The Solarpunk Guild</title>
  <meta name="description" content="Discover the classes of The Solarpunk Guild, how to level up in each one and their ranks.">
  <link rel="canonical" href="https://www.solarpunkguild.example/classes.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Guild classes | The Solarpunk Guild">
  <meta property="og:description" content="Artists, Nightwatchers, Dryads, Gardeners... Discover the classes of the Guild.">
  <meta property="og:url" content="https://www.solarpunkguild.example/classes.html">
  <meta name="theme-color" content="#253D2C">
  <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&display=swap">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">

  <!-- Breadcrumb for search engines (they can show it in their results) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.solarpunkguild.example/" },
      { "@type": "ListItem", "position": 2, "name": "Library", "item": "https://www.solarpunkguild.example/library.html" },
      { "@type": "ListItem", "position": 3, "name": "Guild classes" }
    ]
  }
  </script>

  <script type="module" src="js/pages/classesPage.js"></script>
</head>
<body data-page="classes" data-page-title-key="page.classes.title" data-page-description-key="page.classes.description">

  <header id="site-header"></header>

  <main id="main-content">
    <!-- Breadcrumb navigation for library-related pages -->
    <nav class="page-container breadcrumb" data-i18n-attributes="aria-label:breadcrumb.label">
      <ol class="breadcrumb__list">
        <li class="breadcrumb__item"><a href="index.html" data-i18n="nav.home">Home</a></li>
        <li class="breadcrumb__item"><a href="library.html" data-i18n="nav.library">Library</a></li>
        <li class="breadcrumb__item" aria-current="page" data-i18n="classes.title">Guild classes</li>
      </ol>
    </nav>

    <section class="page-section">
      <div class="page-container">
        <h1 data-i18n="classes.title">Guild classes</h1>
        <p class="page-intro" data-i18n="classes.intro">Each class represents a way of improving the world. Complete quests of an archetype to grow in its class.</p>

        <!-- Hidden automatically when data/classes.json says the system is final -->
        <p class="notice notice--warning" id="leveling-warning" role="note" data-i18n="classes.warning">The leveling system is not final: XP values and ranks may change.</p>

        <!-- Class cards: generated by js/pages/classesPage.js -->
        <div class="content-grid" id="class-list"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
</body>
</html>
