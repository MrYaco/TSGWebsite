<!DOCTYPE html>
<!--
  QUEST BOARD PAGE
  Paragraph 1: "How will you help the world today?"
  Filters: quest type, difficulty. Grid of quest cards (compact format).
  Clicking a card opens the complete format in a modal.
  Logic: js/pages/questboardPage.js -> js/components/questBrowser.js
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quest board | The Solarpunk Guild</title>
  <meta name="description" content="Browse quests by type and difficulty: citizen science, solo actions near you, local group projects and remote online contributions.">
  <link rel="canonical" href="https://www.solarpunkguild.example/questboard.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Quest board | The Solarpunk Guild">
  <meta property="og:description" content="How will you help the world today? Find a free, concrete action to complete.">
  <meta property="og:url" content="https://www.solarpunkguild.example/questboard.html">
  <meta name="theme-color" content="#253D2C">
  <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&display=swap">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">

  <script type="module" src="js/pages/questboardPage.js"></script>
</head>
<body data-page="questboard" data-page-title-key="page.questboard.title" data-page-description-key="page.questboard.description">

  <header id="site-header"></header>

  <main id="main-content">
    <section class="hero hero--compact">
      <div class="page-container">
        <h1 data-i18n="questboard.title">Quest board</h1>
        <p class="page-intro" data-i18n="questboard.intro">How will you help the world today?</p>
      </div>
    </section>

    <section class="page-section">
      <div class="page-container">

        <!-- Filters: the options are added by js/components/questFilters.js -->
        <form class="filter-bar" role="search" data-i18n-attributes="aria-label:filters.label">
          <div class="filter-bar__field">
            <label class="filter-bar__label" for="filter-quest-type" data-i18n="filters.questType">Quest type</label>
            <select class="filter-bar__select" id="filter-quest-type"></select>
          </div>
          <div class="filter-bar__field">
            <label class="filter-bar__label" for="filter-difficulty" data-i18n="filters.difficulty">Difficulty</label>
            <select class="filter-bar__select" id="filter-difficulty"></select>
          </div>
          <button class="button button--ghost" type="button" id="reset-filters-button" data-i18n="filters.reset">Reset filters</button>
        </form>

        <!-- aria-live: screen readers announce the new count when filters change -->
        <p class="result-count" id="quest-result-count" aria-live="polite"></p>

        <!-- Quest cards: generated by js/components/questList.js -->
        <ul class="quest-grid" id="quest-list"></ul>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
</body>
</html>
